<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#edf4ff" />
  <title>꿈별이의 룸메이트 방 구경</title>
  <style>
    :root { --ink:#15274c; --blue:#287be8; --green:#26956e; --pink:#ed5b70; --paper:#f3f7ff; }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:#eaf1ff; }
    button { font:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    .app { width:100%; max-width:560px; min-height:100svh; margin:0 auto; background:linear-gradient(180deg,#f8fbff,#eaf2ff); overflow:hidden; position:relative; }
    .screen { display:none; min-height:100svh; padding:calc(20px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom)); }
    .screen.active { display:flex; flex-direction:column; }
    .eyebrow { margin:0 0 8px; text-align:center; color:#6380aa; font-weight:800; font-size:12px; letter-spacing:.16em; }
    h1 { margin:0; text-align:center; font-size:clamp(25px,7vw,34px); line-height:1.25; letter-spacing:-.05em; }
    .intro { margin:10px 0 22px; text-align:center; color:#61718d; font-size:14px; line-height:1.5; }
    .door-list { display:grid; gap:14px; width:100%; }
    .door-card { border:0; background:#fff; border-radius:22px; box-shadow:0 7px 0 rgba(28,59,107,.08),0 12px 24px rgba(35,69,120,.08); padding:10px; display:grid; grid-template-columns:106px minmax(0,1fr); gap:14px; align-items:center; text-align:left; min-height:144px; transition:transform .16s ease, box-shadow .16s ease; }
    .door-card:active { transform:translateY(3px); box-shadow:0 3px 0 rgba(28,59,107,.08),0 6px 12px rgba(35,69,120,.06); }
    .door { height:124px; border-radius:52px 52px 12px 12px; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; border:4px solid rgba(255,255,255,.7); box-shadow:inset 0 0 0 2px rgba(15,37,78,.12); }
    .door::before { content:""; position:absolute; inset:10px 8px 8px; border:2px solid rgba(255,255,255,.45); border-radius:42px 42px 7px 7px; }
    .door::after { content:""; position:absolute; width:7px; height:7px; border-radius:50%; right:12px; top:62%; background:#fff7bd; box-shadow:0 0 0 3px rgba(23,44,78,.14); }
    .door .door-icon { z-index:1; font-size:34px; filter:drop-shadow(0 2px 1px rgba(0,0,0,.1)); }
    .door.blue { background:linear-gradient(135deg,#73c9ff,#2678e9); }
    .door.green { background:linear-gradient(135deg,#a5e7c7,#27956e); }
    .door.pink { background:linear-gradient(135deg,#ffb8c0,#ed5b70); }
    .door-copy { min-width:0; }
    .door-number { font-size:11px; font-weight:900; letter-spacing:.12em; color:#8292ad; margin-bottom:4px; }
    .door-title { font-size:clamp(17px,4.6vw,21px); font-weight:900; letter-spacing:-.045em; line-height:1.25; word-break:keep-all; }
    .door-desc { margin-top:7px; font-size:12px; line-height:1.45; color:#71809b; word-break:keep-all; }
    .open-label { margin-top:8px; font-size:12px; font-weight:800; }
    .blue-text { color:var(--blue); } .green-text { color:var(--green); } .pink-text { color:var(--pink); }
    .footer-note { text-align:center; color:#8795ac; font-size:11px; margin:18px 0 0; }

    /* Room screen */
    #roomScreen { padding:0; position:relative; height:100svh; min-height:600px; overflow:hidden; background:#dbe8f9; }
    .room-top { position:absolute; z-index:5; top:calc(12px + env(safe-area-inset-top)); left:14px; right:14px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .back-btn, .room-tag { border:1px solid rgba(255,255,255,.8); background:rgba(255,255,255,.91); box-shadow:0 4px 14px rgba(25,46,79,.12); border-radius:999px; padding:11px 14px; color:#23395e; font-size:13px; font-weight:800; min-height:44px; }
    .room-tag { max-width:68%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .room-art { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; }
    .room-vignette { position:absolute; inset:0; background:linear-gradient(180deg,rgba(11,29,59,.08),transparent 35%,rgba(12,32,59,.08)); pointer-events:none; }
    .mascot { position:absolute; z-index:2; width:min(68%,330px); max-height:47%; object-fit:contain; bottom:18%; left:50%; transform:translateX(-50%); filter:drop-shadow(0 10px 9px rgba(30,45,65,.18)); animation:arrive .35s ease-out both; }
    .mascot.quiet { width:min(66%,315px); bottom:18%; }
    .mascot.lively { width:min(72%,350px); bottom:17%; }
    @keyframes arrive { from { opacity:0; transform:translate(-50%,12px) scale(.97); } to { opacity:1; transform:translate(-50%,0) scale(1); } }
    .speech { position:absolute; z-index:4; left:18px; right:18px; bottom:calc(92px + env(safe-area-inset-bottom)); padding:15px 17px; background:rgba(255,255,255,.96); border:2px solid rgba(255,255,255,.85); border-radius:20px; box-shadow:0 8px 24px rgba(27,47,79,.16); text-align:center; font-size:15px; font-weight:800; line-height:1.5; }
    .speech::after { content:""; position:absolute; left:calc(50% - 9px); bottom:-9px; width:16px; height:16px; background:#fff; border-right:2px solid rgba(255,255,255,.85); border-bottom:2px solid rgba(255,255,255,.85); transform:rotate(45deg); }
    .room-actions { position:absolute; z-index:5; bottom:calc(18px + env(safe-area-inset-bottom)); left:18px; right:18px; display:flex; gap:10px; }
    .action-btn { flex:1; min-height:50px; border:0; border-radius:16px; font-size:14px; font-weight:900; box-shadow:0 5px 0 rgba(20,44,83,.12); }
    .action-primary { background:#fff; color:#24416e; }
    .action-secondary { background:#24416e; color:white; }
    .room-hotspot { position:absolute; z-index:3; border:0; background:rgba(255,255,255,.9); border:2px solid rgba(255,255,255,.9); box-shadow:0 3px 12px rgba(15,35,65,.18); border-radius:50%; width:46px; height:46px; font-size:22px; display:grid; place-items:center; animation:pulse 1.8s ease-in-out infinite; }
    .hotspot-one { left:12%; top:40%; } .hotspot-two { right:12%; top:48%; }
    @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.08); } }
    .toast { position:absolute; z-index:8; top:calc(74px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); max-width:calc(100% - 36px); padding:10px 14px; border-radius:14px; background:#172b50; color:white; font-size:13px; font-weight:700; text-align:center; box-shadow:0 5px 16px rgba(0,0,0,.15); display:none; }
    .toast.show { display:block; animation:fade .2s ease-out; }
    @keyframes fade { from { opacity:0; transform:translate(-50%,-5px); } to { opacity:1; transform:translate(-50%,0); } }
    @media (min-width:520px) {
      .screen:not(#roomScreen) { padding-left:28px; padding-right:28px; }
      .door-card { grid-template-columns:120px minmax(0,1fr); }
      .door { height:130px; }
    }
    @media (max-height:700px) {
      .mascot { max-height:39%; bottom:20%; }
      .mascot.quiet { bottom:19%; }
      .speech { bottom:calc(82px + env(safe-area-inset-bottom)); padding:11px 14px; }
      .room-actions { bottom:calc(12px + env(safe-area-inset-bottom)); }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }
  </style>
</head>
<body>
  <main class="app" aria-live="polite">
    <section class="screen active" id="homeScreen">
      <p class="eyebrow">DREAM ROOMMATE</p>
      <h1>어떤 룸메이트의<br>방을 열어볼까?</h1>
      <p class="intro">궁금한 방문을 눌러 꿈별이의 방을 구경해 봐!</p>
      <div class="door-list">
        <button class="door-card" data-room="clean" aria-label="깔끔한 룸메이트 방 열기">
          <span class="door blue"><span class="door-icon" aria-hidden="true">🧹</span></span>
          <span class="door-copy"><span class="door-number">ROOM 01</span><span class="door-title blue-text">깔끔한 룸메이트</span><span class="door-desc">정리정돈을 좋아하는 꿈별이</span><span class="open-label blue-text">방 열어보기 →</span></span>
        </button>
        <button class="door-card" data-room="quiet" aria-label="조용한 룸메이트 방 열기">
          <span class="door green"><span class="door-icon" aria-hidden="true">📚</span></span>
          <span class="door-copy"><span class="door-number">ROOM 02</span><span class="door-title green-text">조용한 룸메이트</span><span class="door-desc">혼자만의 시간을 소중히 하는 꿈별이</span><span class="open-label green-text">방 열어보기 →</span></span>
        </button>
        <button class="door-card" data-room="lively" aria-label="활기찬 룸메이트 방 열기">
          <span class="door pink"><span class="door-icon" aria-hidden="true">🎵</span></span>
          <span class="door-copy"><span class="door-number">ROOM 03</span><span class="door-title pink-text">활기찬 룸메이트</span><span class="door-desc">사람들과 어울리는 걸 좋아하는 꿈별이</span><span class="open-label pink-text">방 열어보기 →</span></span>
        </button>
      </div>
      <p class="footer-note">꿈별이의 방을 탐험해 보세요 ✦</p>
    </section>

    <section class="screen" id="roomScreen" aria-label="룸메이트 방">
      <img class="room-art" id="roomBackground" src="assets/rooms/clean.png" alt="룸메이트의 기숙사 방 배경" />
      <div class="room-vignette"></div>
      <header class="room-top">
        <button class="back-btn" id="backBtn">← 방문으로</button>
        <div class="room-tag" id="roomTitle">깔끔한 룸메이트</div>
      </header>
      <button class="room-hotspot hotspot-one" id="itemOne" aria-label="방 안의 아이템 살펴보기">✨</button>
      <button class="room-hotspot hotspot-two" id="itemTwo" aria-label="다른 아이템 살펴보기">🔎</button>
      <img class="mascot" id="roomMascot" src="assets/mascots/clean.png" alt="청소하는 꿈별이" />
      <div class="toast" id="toast" role="status"></div>
      <div class="speech" id="speech">안녕! 오늘도 방을 깨끗하게 정리해 볼까?</div>
      <div class="room-actions">
        <button class="action-btn action-primary" id="talkBtn">꿈별이에게 말 걸기</button>
        <button class="action-btn action-secondary" id="nextBtn">다른 방 구경하기</button>
      </div>
    </section>
  </main>
  <script>
    const rooms = {
      clean: {
        title: '깔끔한 룸메이트', bg: 'assets/rooms/clean.png', mascot: 'assets/mascots/clean.png',
        alt: '청소하는 꿈별이', color: '#287be8',
        lines: ['안녕! 오늘도 방을 깨끗하게 정리해 볼까?', '물건은 쓰고 나면 제자리에 두는 게 좋아!', '깨끗한 방에 있으면 기분까지 상쾌해져!'],
        items: ['반짝반짝! 이 방은 정리정돈이 잘 되어 있어.', '청소도구 발견! 꿈별이가 매일 사용하는 아이템이야.']
      },
      quiet: {
        title: '조용한 룸메이트', bg: 'assets/rooms/quiet.png', mascot: 'assets/mascots/quiet.png',
        alt: '책을 읽는 꿈별이', color: '#26956e',
        lines: ['쉿, 지금은 책 읽는 시간! 편하게 쉬다 가.', '혼자만의 시간도 정말 소중하거든.', '서로의 생활 패턴을 존중하면 더 편안해!'],
        items: ['좋아하는 책을 읽으며 조용히 쉬고 있어.', '따뜻한 차 한 잔과 함께라면 더 완벽한 휴식!']
      },
      lively: {
        title: '활기찬 룸메이트', bg: 'assets/rooms/lively.png', mascot: 'assets/mascots/lively.png',
        alt: '신나게 춤추는 꿈별이', color: '#ed5b70',
        lines: ['어서 와! 같이 신나게 놀아 볼까?', '친구들과 수다 떨면 시간 가는 줄 몰라!', '함께하면 일상이 더 즐거워지는 것 같아!'],
        items: ['좋아하는 음악이 나오면 몸이 절로 움직여!', '재미있는 소품이 가득한 꿈별이의 공간이야.']
      }
    };
    const home = document.getElementById('homeScreen');
    const roomScreen = document.getElementById('roomScreen');
    const bg = document.getElementById('roomBackground');
    const mascot = document.getElementById('roomMascot');
    const title = document.getElementById('roomTitle');
    const speech = document.getElementById('speech');
    const toast = document.getElementById('toast');
    let current = 'clean';
    let lineIndex = 0;
    let itemIndex = 0;
    function openRoom(key) {
      current = key; lineIndex = 0; itemIndex = 0;
      const room = rooms[key];
      bg.src = room.bg; bg.alt = room.title + ' 배경';
      mascot.src = room.mascot; mascot.alt = room.alt;
      mascot.className = 'mascot' + (key === 'quiet' ? ' quiet' : key === 'lively' ? ' lively' : '');
      title.textContent = room.title; title.style.color = room.color;
      speech.textContent = room.lines[0];
      home.classList.remove('active'); roomScreen.classList.add('active');
      toast.classList.remove('show');
    }
    function backHome() { roomScreen.classList.remove('active'); home.classList.add('active'); toast.classList.remove('show'); }
    function showToast(message) { toast.textContent = message; toast.classList.add('show'); }
    document.querySelectorAll('[data-room]').forEach(btn => btn.addEventListener('click', () => openRoom(btn.dataset.room)));
    document.getElementById('backBtn').addEventListener('click', backHome);
    document.getElementById('nextBtn').addEventListener('click', () => {
      const order = ['clean','quiet','lively'];
      openRoom(order[(order.indexOf(current) + 1) % order.length]);
    });
    document.getElementById('talkBtn').addEventListener('click', () => {
      const room = rooms[current]; lineIndex = (lineIndex + 1) % room.lines.length;
      speech.textContent = room.lines[lineIndex];
    });
    document.getElementById('itemOne').addEventListener('click', () => { showToast(rooms[current].items[itemIndex % 2]); itemIndex++; });
    document.getElementById('itemTwo').addEventListener('click', () => { showToast(rooms[current].items[itemIndex % 2]); itemIndex++; });
  </script>
</body>
</html>
